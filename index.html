<!DOCTYPE html>
<html><head><title>QR Generator</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<style>body{font-family:sans-serif;max-width:500px;margin:40px auto;text-align:center}
input{width:80%;padding:10px;font-size:16px;margin:10px 0}
button{padding:10px 20px;font-size:16px;background:#6c5ce7;color:white;border:none;border-radius:5px;cursor:pointer}
canvas{margin-top:20px}</style></head>
<body><h2>QR Code Generator</h2>
<input id="text" placeholder="Enter text or URL...">
<br><button onclick="generate()">Generate</button>
<canvas id="qr"></canvas>
<script>function generate(){
QRCode.toCanvas(document.getElementById('qr'),document.getElementById('text').value)}</script>
</body></html>
